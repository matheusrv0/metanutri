# Publica o site público do MetaNutri (metanutri.com.br) no GitHub Pages: a landing, Preços, Termos, Privacidade e
# Referências. O app (app.metanutri.com.br) não sai daqui: a Cloudflare monta e publica a partir da main, com as chaves
# dela (spec separacao-site-app, D-500 e DP-SA-33).
# Só roda quando você manda rodar: Actions > Publicar no GitHub Pages > Run workflow.
# Antes da primeira vez, em Settings > Pages, escolha "GitHub Actions" como origem.
# Cada ação vai fixada pelo commit, com a versão no comentário: a etiqueta (v4) pode passar a apontar para outro código.
# Para atualizar: gh api repos/<dono>/<ação>/commits/<etiqueta> --jq .sha
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Conferir termos antes de publicar
        run: node scripts/conferir-publicacao.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # D-137: alerta alto ou crítico no que vai para o site (sem as ferramentas de desenvolvimento) para a publicação.
      - name: Conferir alertas de segurança dos pacotes
        run: npm audit --omit=dev --audit-level=high
      # O site não tem conta, pagamento nem verificação contra robôs (D-502): o build não leva chave nenhuma.
      - run: npm run build:site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
