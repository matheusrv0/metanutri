# Publica o MetaNutri no GitHub Pages.
# Só roda quando você manda rodar: Actions > Publicar no GitHub Pages > Run workflow.
# Antes da primeira vez, em Settings > Pages, escolha "GitHub Actions" como origem.
# Cada ação vai fixada pelo commit, com a versão no comentário: a etiqueta (v4) pode passar a apontar para outro código.
# Para atualizar: gh api repos/<dono>/<ação>/commits/<etiqueta> --jq .sha
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Conferir termos antes de publicar
        run: node scripts/conferir-publicacao.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Sem estas duas, o site publicado sai sem conta e sem nuvem: o link das
          # missões só abriria no navegador de quem montou o plano.
          # A URL é variável (é pública); a chave anon é secret para ficar fora do
          # repositório e poder ser trocada sem commit. Ela vai para o JavaScript
          # do site de qualquer jeito — é assim que o Supabase foi desenhado.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # A chave PÚBLICA do pagamento (D-72) abre os campos seguros do cartão. É variável,
          # não segredo: vai no JavaScript do site de qualquer jeito. Sem ela, o checkout
          # publicado diz "O pagamento não está disponível agora."
          VITE_MERCADOPAGO_PUBLIC_KEY: ${{ vars.VITE_MERCADOPAGO_PUBLIC_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
