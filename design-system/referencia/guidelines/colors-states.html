ht:56px;border-radius:12px;background:var(--state-info)"></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="n">Referência / fonte</span></div><span class="mn-badge" style="background:var(--state-info-bg);color:var(--state-info-text);align-self:flex-start">RDA</span><span class="m" style="font-family:var(--font-data);font-size:11px">--state-info</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:56px;border-radius:12px;background:repeating-linear-gradient(-45deg,var(--state-nodata-a) 0 6px,var(--state-nodata-b) 6px 9px)"></div><span class="n">Sem dado</span><span class="mn-badge mn-badge--neutral" style="align-self:flex-start">sem dado</span><span class="m" style="font-family:var(--font-data);font-size:11px">hachura, nunca zero</span></div></div></body></html>
